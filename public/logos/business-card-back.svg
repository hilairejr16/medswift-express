<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600" role="img" aria-label="MEDSWIFT EXPRESS Business Card Back">
  <!--  3.5" × 2" @ 300 DPI = 1050 × 600 px  —  clean white back  -->
  <defs>
    <linearGradient id="bk-shield" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e4d8c"/>
      <stop offset="100%" stop-color="#1B3C6E"/>
    </linearGradient>
    <linearGradient id="bk-swoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC1F35"/>
      <stop offset="100%" stop-color="#A01828"/>
    </linearGradient>
    <linearGradient id="bk-hl" x1="0%" y1="0%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="1050" height="600" rx="18" fill="#ffffff"/>

  <!-- Navy top bar -->
  <rect x="0" y="0" width="1050" height="12" rx="18" fill="#1B3C6E"/>
  <rect x="0" y="0" width="1050" height="12" fill="#1B3C6E" rx="0"/>
  <rect x="0" y="0" width="1050" height="12" rx="18" fill="#1B3C6E"/>

  <!-- Red bottom bar -->
  <rect x="0" y="588" width="1050" height="12" rx="18" fill="#CC1F35"/>
  <rect x="0" y="588" width="1050" height="12" fill="#CC1F35" rx="0"/>
  <rect x="0" y="588" width="1050" height="12" rx="18" fill="#CC1F35"/>

  <!-- Left navy accent stripe -->
  <rect x="0" y="0" width="14" height="600" fill="#1B3C6E"/>
  <!-- Right red accent stripe -->
  <rect x="1036" y="0" width="14" height="600" fill="#CC1F35"/>

  <!-- Shield centered — scale 2.4, shield = 240×276; center at (525-120=405, 600/2-138=162) -->
  <g transform="translate(405, 62) scale(2.4)">
    <path d="M50,3 L97,17 L97,63 C97,91 77,108 50,118 C23,108 3,91 3,63 L3,17 Z" fill="url(#bk-shield)"/>
    <path d="M50,8 L92,21 L92,63 C92,88 74,103 50,112 C26,103 8,88 8,63 L8,21 Z" fill="none" stroke="#fff" stroke-width="0.7" stroke-opacity="0.18"/>
    <path d="M50,8 L92,21 L92,48 C78,28 50,20 8,36 L8,21 Z" fill="url(#bk-hl)"/>
    <path d="M3,57 L97,41 L97,54 L3,70 Z" fill="url(#bk-swoosh)"/>
    <path d="M18,108 L18,65 L29,65 L50,89 L71,65 L82,65 L82,108 L73,108 L73,78 L51,97 L49,97 L27,78 L27,108 Z" fill="#ffffff"/>
  </g>

  <!-- Wordmark centered -->
  <text x="525" y="432"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="62" font-weight="900" letter-spacing="-2"
        text-anchor="middle">
    <tspan fill="#1B3C6E">MED</tspan><tspan fill="#CC1F35">SWIFT</tspan>
  </text>
  <text x="525" y="468"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="20" font-weight="900" letter-spacing="12"
        fill="#1B3C6E" text-anchor="middle" opacity="0.8">EXPRESS</text>

  <!-- Red underline -->
  <rect x="448" y="478" width="154" height="3" rx="1.5" fill="#CC1F35"/>

  <!-- Website -->
  <text x="525" y="552"
        font-family="Arial,sans-serif" font-size="18" font-weight="700"
        fill="#1B3C6E" text-anchor="middle" letter-spacing="1">medswiftexpress.com</text>
</svg>
