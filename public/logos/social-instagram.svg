<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="MEDSWIFT EXPRESS Instagram Profile Logo">
  <defs>
    <radialGradient id="igBg" cx="30%" cy="100%" r="120%">
      <stop offset="0%" style="stop-color:#FEDA77"/>
      <stop offset="30%" style="stop-color:#F58529"/>
      <stop offset="60%" style="stop-color:#DD2A7B"/>
      <stop offset="85%" style="stop-color:#8134AF"/>
      <stop offset="100%" style="stop-color:#515BD4"/>
    </radialGradient>
    <linearGradient id="igShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3C6E"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="igSwoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CC1F35"/>
      <stop offset="100%" style="stop-color:#9B1827"/>
    </linearGradient>
  </defs>

  <!-- Instagram gradient background -->
  <rect width="500" height="500" rx="110" fill="url(#igBg)"/>

  <!-- Shield icon centered -->
  <g transform="translate(138, 60)">
    <path d="M112,18 L210,52 L210,158 C210,214 166,258 112,278 C58,258 14,214 14,158 L14,52 Z" fill="white" opacity="0.18"/>
    <path d="M112,18 L210,52 L210,158 C210,214 166,258 112,278 C58,258 14,214 14,158 L14,52 Z" fill="none" stroke="white" stroke-width="2.5"/>
    <!-- Swoosh -->
    <path d="M14,138 L210,106 L210,122 L14,156 Z" fill="url(#igSwoosh)" opacity="0.95"/>
    <!-- M lettermark -->
    <text x="112" y="214" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" fill="white" text-anchor="middle">M</text>
  </g>

  <!-- MEDSWIFT -->
  <text x="250" y="365" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">
    <tspan>MED</tspan><tspan fill="#FFD6DC">SWIFT</tspan>
  </text>
  <!-- EXPRESS -->
  <text x="250" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle" letter-spacing="8" opacity="0.9">EXPRESS</text>
  <!-- Underline -->
  <rect x="185" y="408" width="130" height="2.5" fill="white" opacity="0.6" rx="1.5"/>
  <!-- Tagline -->
  <text x="250" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.75" letter-spacing="1">ATLANTA, GA · MEDICAL COURIER</text>
</svg>
