<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="MEDSWIFT EXPRESS Logo (White)">
  <!-- Use on dark/navy/photo backgrounds -->
  <defs>
    <linearGradient id="w-highlight" x1="0%" y1="0%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── SHIELD ICON — outline version on transparent/dark bg ── -->
  <g transform="translate(6,8) scale(0.88)">
    <!-- Shield fill (semi-transparent white) -->
    <path d="M50,3 L97,17 L97,63 C97,91 77,108 50,118 C23,108 3,91 3,63 L3,17 Z"
          fill="white" fill-opacity="0.12"/>
    <!-- Shield stroke -->
    <path d="M50,3 L97,17 L97,63 C97,91 77,108 50,118 C23,108 3,91 3,63 L3,17 Z"
          fill="none" stroke="white" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Inner border -->
    <path d="M50,8 L92,21 L92,63 C92,88 74,103 50,112 C26,103 8,88 8,63 L8,21 Z"
          fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25"/>
    <!-- Top sheen -->
    <path d="M50,8 L92,21 L92,48 C78,28 50,20 8,36 L8,21 Z"
          fill="url(#w-highlight)"/>
    <!-- Red swoosh -->
    <path d="M3,57 L97,41 L97,54 L3,70 Z"
          fill="#CC1F35" opacity="0.92"/>
    <!-- White M -->
    <path d="M18,108 L18,65 L29,65 L50,89 L71,65 L82,65 L82,108 L73,108 L73,78 L51,97 L49,97 L27,78 L27,108 Z"
          fill="#ffffff"/>
  </g>

  <!-- ── WORDMARK — all white with red on SWIFT ── -->
  <text x="105" y="70"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="54" font-weight="900" letter-spacing="-1"
        fill="#ffffff">MED</text>
  <text x="219" y="70"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="54" font-weight="900" letter-spacing="-1"
        fill="#FF3D52">SWIFT</text>

  <!-- "EXPRESS" white -->
  <text x="107" y="95"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="15" font-weight="900" letter-spacing="9"
        fill="#ffffff" opacity="0.88">EXPRESS</text>

  <!-- Red accent bar -->
  <rect x="107" y="102" width="58" height="2.5" rx="1.25" fill="#CC1F35"/>

  <!-- Divider -->
  <line x1="98" y1="18" x2="98" y2="102" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>
</svg>
