<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130" role="img" aria-label="MEDSWIFT EXPRESS White Logo">
  <!-- Use on dark/colored backgrounds: navy, red, dark photo overlays -->

  <!-- Badge / Shield Icon (white outline version) -->
  <g transform="translate(8, 8)">
    <path d="M57,6 L99,22 L99,62 C99,85 79,105 57,114 C35,105 15,85 15,62 L15,22 Z" fill="white" opacity="0.15"/>
    <path d="M57,6 L99,22 L99,62 C99,85 79,105 57,114 C35,105 15,85 15,62 L15,22 Z" fill="none" stroke="white" stroke-width="2.5"/>
    <!-- Red swoosh stripe -->
    <path d="M15,54 L99,38 L99,50 L15,66 Z" fill="#FF4D65" opacity="0.9"/>
    <!-- White M lettermark -->
    <text x="57" y="80" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">M</text>
    <circle cx="33" cy="98" r="3" fill="#FF4D65" opacity="0.7"/>
    <circle cx="81" cy="98" r="3" fill="#FF4D65" opacity="0.7"/>
  </g>

  <!-- Wordmark — all white with red accent on SWIFT -->
  <g transform="translate(130, 0)">
    <text x="0" y="72" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">MED</text>
    <text x="112" y="72" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#FF4D65" letter-spacing="-1">SWIFT</text>
    <text x="1" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="white" letter-spacing="8">EXPRESS</text>
    <text x="1" y="116" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="white" letter-spacing="2" opacity="0.65">ATLANTA, GA · MEDICAL COURIER</text>
    <rect x="1" y="100" width="60" height="2" fill="#FF4D65" rx="1"/>
  </g>
</svg>
