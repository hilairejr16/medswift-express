<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="MEDSWIFT EXPRESS Logo">
  <defs>
    <linearGradient id="h-shield" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e4d8c"/>
      <stop offset="100%" stop-color="#1B3C6E"/>
    </linearGradient>
    <linearGradient id="h-swoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC1F35"/>
      <stop offset="100%" stop-color="#A01828"/>
    </linearGradient>
    <linearGradient id="h-highlight" x1="0%" y1="0%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── SHIELD ICON (left, scaled to ~88px wide × 103px tall, centered in 120px height) ── -->
  <!-- Shield path in 0-100 / 0-115 space, transformed: translate(6, 8) scale(0.88) -->
  <g transform="translate(6,8) scale(0.88)">
    <!-- Shield fill -->
    <path d="M50,3 L97,17 L97,63 C97,91 77,108 50,118 C23,108 3,91 3,63 L3,17 Z"
          fill="url(#h-shield)"/>
    <!-- Inner border highlight -->
    <path d="M50,8 L92,21 L92,63 C92,88 74,103 50,112 C26,103 8,88 8,63 L8,21 Z"
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.14"/>
    <!-- Top sheen -->
    <path d="M50,8 L92,21 L92,48 C78,28 50,20 8,36 L8,21 Z"
          fill="url(#h-highlight)"/>
    <!-- Red swoosh -->
    <path d="M3,57 L97,41 L97,54 L3,70 Z"
          fill="url(#h-swoosh)"/>
    <!-- White M — geometric bold path -->
    <path d="M18,108 L18,65 L29,65 L50,89 L71,65 L82,65 L82,108 L73,108 L73,78 L51,97 L49,97 L27,78 L27,108 Z"
          fill="#ffffff"/>
  </g>

  <!-- ── WORDMARK (right of shield) ── -->
  <!-- "MED" in navy -->
  <text x="105" y="70"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="54" font-weight="900" letter-spacing="-1"
        fill="#1B3C6E">MED</text>
  <!-- "SWIFT" in red, immediately after MED -->
  <text x="219" y="70"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="54" font-weight="900" letter-spacing="-1"
        fill="#CC1F35">SWIFT</text>

  <!-- "EXPRESS" — navy, spaced, smaller -->
  <text x="107" y="95"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="15" font-weight="900" letter-spacing="9"
        fill="#1B3C6E">EXPRESS</text>

  <!-- Red accent bar under EXPRESS -->
  <rect x="107" y="102" width="58" height="2.5" rx="1.25" fill="#CC1F35"/>

  <!-- Thin vertical divider between icon and wordmark -->
  <line x1="98" y1="18" x2="98" y2="102" stroke="#E2E8F0" stroke-width="1"/>
</svg>
