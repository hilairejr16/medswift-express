<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115" width="100" height="115" role="img" aria-label="MEDSWIFT EXPRESS Icon">
  <defs>
    <linearGradient id="ic-shield" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e4d8c"/>
      <stop offset="100%" stop-color="#1B3C6E"/>
    </linearGradient>
    <linearGradient id="ic-swoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC1F35"/>
      <stop offset="100%" stop-color="#A01828"/>
    </linearGradient>
    <!-- Subtle inner highlight -->
    <linearGradient id="ic-highlight" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shield fill -->
  <path d="M50,3 L97,17 L97,63 C97,91 77,108 50,118 C23,108 3,91 3,63 L3,17 Z"
        fill="url(#ic-shield)"/>

  <!-- Shield inner border (depth) -->
  <path d="M50,8 L92,21 L92,63 C92,88 74,103 50,112 C26,103 8,88 8,63 L8,21 Z"
        fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Inner highlight (top sheen) -->
  <path d="M50,8 L92,21 L92,50 C80,30 50,20 8,38 L8,21 Z"
        fill="url(#ic-highlight)"/>

  <!-- Red swoosh band -->
  <path d="M3,57 L97,41 L97,54 L3,70 Z" fill="url(#ic-swoosh)"/>

  <!-- White M — path-based, geometric bold condensed -->
  <path d="M18,108 L18,65 L29,65 L50,89 L71,65 L82,65 L82,108 L73,108 L73,78 L51,97 L49,97 L27,78 L27,108 Z"
        fill="#ffffff"/>
</svg>
