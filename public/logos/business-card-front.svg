<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600" role="img" aria-label="MEDSWIFT EXPRESS Business Card Front">
  <!--  3.5" × 2" @ 300 DPI = 1050 × 600 px  |  Safe zone: 75px from each edge  -->
  <defs>
    <linearGradient id="bc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4d8c"/>
      <stop offset="100%" stop-color="#1B3C6E"/>
    </linearGradient>
    <linearGradient id="bc-shield" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2255a4"/>
      <stop offset="100%" stop-color="#163260"/>
    </linearGradient>
    <linearGradient id="bc-swoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC1F35"/>
      <stop offset="100%" stop-color="#A01828"/>
    </linearGradient>
    <linearGradient id="bc-hl" x1="0%" y1="0%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1050" height="600" rx="18" fill="url(#bc-bg)"/>

  <!-- Top red bar -->
  <rect x="0" y="0" width="1050" height="10" rx="18" fill="#CC1F35"/>
  <rect x="0" y="0" width="1050" height="10" fill="#CC1F35" rx="0"/>
  <rect x="0" y="0" width="1050" height="10" rx="18" fill="#CC1F35"/>

  <!-- Bottom red bar -->
  <rect x="0" y="590" width="1050" height="10" rx="18" fill="#CC1F35"/>
  <rect x="0" y="590" width="1050" height="10" fill="#CC1F35" rx="0"/>
  <rect x="0" y="590" width="1050" height="10" rx="18" fill="#CC1F35"/>

  <!-- Subtle diagonal tonal shape -->
  <path d="M0,380 L320,600 L0,600 Z" fill="#ffffff" fill-opacity="0.03"/>
  <path d="M730,0 L1050,0 L1050,300 Z" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Shield icon — scaled 1.4× the 0-100/0-115 space, placed left -->
  <!-- Scale: 1.4 → 140w × 161h; translate(68, 218) centers it vertically in 600px -->
  <g transform="translate(68, 218) scale(1.4)">
    <path d="M50,3 L97,17 L97,63 C97,91 77,108 50,118 C23,108 3,91 3,63 L3,17 Z" fill="url(#bc-shield)"/>
    <path d="M50,8 L92,21 L92,63 C92,88 74,103 50,112 C26,103 8,88 8,63 L8,21 Z" fill="none" stroke="#fff" stroke-width="0.8" stroke-opacity="0.18"/>
    <path d="M50,8 L92,21 L92,48 C78,28 50,20 8,36 L8,21 Z" fill="url(#bc-hl)"/>
    <path d="M3,57 L97,41 L97,54 L3,70 Z" fill="url(#bc-swoosh)"/>
    <path d="M18,108 L18,65 L29,65 L50,89 L71,65 L82,65 L82,108 L73,108 L73,78 L51,97 L49,97 L27,78 L27,108 Z" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="248" y="248"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="78" font-weight="900" letter-spacing="-2">
    <tspan fill="#ffffff">MED</tspan><tspan fill="#FF3D52">SWIFT</tspan>
  </text>
  <text x="251" y="294"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="22" font-weight="900" letter-spacing="12"
        fill="#ffffff" opacity="0.82">EXPRESS</text>
  <rect x="251" y="305" width="84" height="3" rx="1.5" fill="#CC1F35"/>

  <!-- Tagline -->
  <text x="252" y="344"
        font-family="Arial,sans-serif" font-size="16"
        fill="#ffffff" opacity="0.55" letter-spacing="2">MEDICAL COURIER · ATLANTA, GA</text>

  <!-- Divider -->
  <line x1="68" y1="400" x2="982" y2="400" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Name -->
  <text x="68" y="447"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="28" font-weight="900" fill="#ffffff">Natasha Mutakura</text>
  <text x="68" y="475"
        font-family="Arial,sans-serif" font-size="16"
        fill="#FF3D52" font-weight="700" letter-spacing="1">OWNER · MEDSWIFT EXPRESS</text>

  <!-- Contact (right-aligned) -->
  <text x="982" y="447" font-family="Arial,sans-serif" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">📞 (757) 940-8468</text>
  <text x="982" y="470" font-family="Arial,sans-serif" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">🌐 medswiftexpress.com</text>
  <text x="982" y="493" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" opacity="0.55" text-anchor="end">Atlanta, GA Metro Area</text>

  <!-- Bottom micro tagline -->
  <text x="525" y="565"
        font-family="Arial,sans-serif" font-size="12"
        fill="#ffffff" opacity="0.35" text-anchor="middle" letter-spacing="4">RELIABLE · PROFESSIONAL · DISCREET</text>
</svg>
